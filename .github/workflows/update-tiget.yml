name: TIGET自動更新

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install requests

      - name: TIGETデータを取得してtiget_data.jsonを更新
        env:
          TIGET_REFRESH_TOKEN: ${{ secrets.TIGET_REFRESH_TOKEN }}
          JSON_PATH:           tiget_data.json
        run: python scripts/tiget_auto_update.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiget_data.json
          if git diff --cached --quiet; then
            echo "変更なし。スキップします。"
          else
            git commit -m "🤖 TIGET自動更新 $(date +'%Y-%m-%d')"
            git push
          fi
